aid: 1qbit
name: 1QBit
description: '1QB Information Technologies Inc. (1QBit) is a quantum computing software
  company founded in 2012 and headquartered in Vancouver, British Columbia, Canada.
  It builds hardware-agnostic algorithms and software for optimization, simulation,
  and machine learning that run across quantum, quantum-inspired, and classical high-performance
  computing hardware, with work spanning computational finance, life sciences and
  quantum chemistry, materials, and telecommunications. 1QBit has hardware and platform
  partnerships with D-Wave, Fujitsu, IBM, and Microsoft Azure Quantum, and participates
  in DARPA''s Quantum Benchmarking Initiative (QBI) on automated design tools for
  utility-scale quantum computation. The company markets a 1Qloud optimization platform
  whose own marketing page cites Python SDK, gRPC, and REST API interfaces, but as
  of August 2026 1QBit publishes no public developer portal, API reference, or machine-readable
  API contract — the former portal.1qbit.com host no longer resolves and access is
  arranged through industry partnerships. Its only public developer surface is a small
  GitHub organization of research code plus two first-party Python libraries on PyPI.'
